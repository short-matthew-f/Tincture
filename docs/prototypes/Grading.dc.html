<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grading board</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#7B5236}a:hover{color:#5A3B26}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #E3E6E0; font-family: 'Figtree', 'Segoe UI', sans-serif; color: #2A2622; display: flex; flex-direction: column; overflow: hidden">

<div style="padding: 18px 18px 10px 18px; display: flex; align-items: center; justify-content: space-between">
<button aria-label="Back to puzzles" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: #F7F4EC; box-shadow: 0 2px 0 rgba(42,38,34,0.2); display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#2A2622" style="stroke-width: 2" aria-hidden="true"><path d="M12 4 L6 10 L12 16"></path></svg>
</button>
<div style="text-align: center">
<div style="font-family: 'Young Serif', Georgia, serif; font-size: 20px">Grading</div>
<div style="font-size: 13px; color: #5E5148">Relaxed, {{moves}} swaps</div>
</div>
<button onClick="{{shuffle}}" style="min-height: 44px; padding: 0 14px; border: 0; border-radius: 12px; background: #F7F4EC; color: #2A2622; font-size: 14px; font-weight: 600; box-shadow: 0 2px 0 rgba(42,38,34,0.2)">Reshuffle</button>
</div>

<div style="margin: 6px 14px 0 14px; background: #F7F4EC; border-radius: 18px; padding: 12px; box-shadow: 0 4px 0 rgba(42,38,34,0.26)">
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0px; border-radius: 10px; overflow: hidden">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="30">
<button aria-label="{{t.label}}" onClick="{{t.tap}}" style="height: 84px; border: 0; margin: 0; background: {{t.bg}}; box-shadow: {{t.ring}}; display: flex; align-items: center; justify-content: center">
<sc-if value="{{t.anchor}}" hint-placeholder-val="{{false}}">
<div style="width: 8px; height: 8px; border-radius: 4px; background: #2A2622; box-shadow: 0 0 0 2px #F7F4EC"></div>
</sc-if>
</button>
</sc-for>
</div>
</div>

<div style="margin: 14px 14px 0 14px; display: flex; gap: 10px">
<button onClick="{{listen}}" style="flex-grow: 1; min-height: 48px; border: 0; border-radius: 12px; background: #2A2622; color: #F7F4EC; font-size: 15px; font-weight: 600; box-shadow: 0 3px 0 #000000; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#F7F4EC" style="stroke-width: 1.8" aria-hidden="true"><path d="M3 8 H6 L10 4 V16 L6 12 H3 Z"></path><path d="M13 7 C14.5 8.5 14.5 11.5 13 13"></path><path d="M15.5 5 C18 7.5 18 12.5 15.5 15"></path></svg>Hear the board</button>
<button onClick="{{toggleSound}}" aria-pressed="{{soundOn}}" style="min-height: 48px; padding: 0 16px; border: 0; border-radius: 12px; background: #F7F4EC; color: #2A2622; font-size: 15px; font-weight: 600; box-shadow: 0 3px 0 rgba(42,38,34,0.25)">{{soundLabel}}</button>
</div>

<div style="margin: 12px 14px 0 14px; background: #F7F4EC; border-radius: 14px; padding: 12px 14px; box-shadow: 0 3px 0 rgba(42,38,34,0.22); display: flex; gap: 12px; align-items: center">
<sc-if value="{{solved}}" hint-placeholder-val="{{false}}">
<div style="width: 44px; height: 44px; border-radius: 10px; background: #5FA39A; box-shadow: 0 3px 0 rgba(42,38,34,0.28); flex-shrink: 0"></div>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 3px">
<div style="font-family: 'Young Serif', Georgia, serif; font-size: 17px">{{headline}}</div>
<div style="font-size: 14px; color: #5E5148">{{detail}}</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.cols = 5;
    this.rows = 6;
    this.anchors = [0, 4, 25, 29, 12, 17];
    this.colors = this.buildGradient();
    this.state = { order: this.shuffled(7), sel: null, moves: 0, soundOn: true };
    this.scale = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26];
  }
  audio() {
    if (!this.state.soundOn) return null;
    if (!this.ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      this.ac = new AC();
      this.master = this.ac.createGain();
      this.master.gain.value = 0.5;
      this.master.connect(this.ac.destination);
    }
    if (this.ac.state === 'suspended') this.ac.resume();
    return this.ac;
  }
  noteHz(v) {
    const lo = this.Lmin, hi = this.Lmax;
    const k = Math.round((this.Ls[v] - lo) / (hi - lo) * (this.scale.length - 1));
    return 196 * Math.pow(2, this.scale[k] / 12);
  }
  tink(hz, delay, vol) {
    const ac = this.audio(); if (!ac) return;
    const t = ac.currentTime + (delay || 0);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.35, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
    g.connect(this.master);
    const o1 = ac.createOscillator(); o1.type = 'sine'; o1.frequency.value = hz; o1.connect(g);
    const g2 = ac.createGain(); g2.gain.value = 0.18; g2.connect(g);
    const o2 = ac.createOscillator(); o2.type = 'sine'; o2.frequency.value = hz * 2.76; o2.connect(g2);
    o1.start(t); o2.start(t); o1.stop(t + 1); o2.stop(t + 1);
  }
  tick(hz, len, vol) {
    const ac = this.audio(); if (!ac) return;
    const t = ac.currentTime;
    const g = ac.createGain();
    g.gain.setValueAtTime(vol || 0.08, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (len || 0.05));
    g.connect(this.master);
    const o = ac.createOscillator(); o.type = 'triangle'; o.frequency.value = hz || 1600; o.connect(g);
    o.start(t); o.stop(t + (len || 0.05) + 0.02);
  }
  playSolve() {
    const idx = this.Ls.map((L, i) => i).sort((a, b) => this.Ls[a] - this.Ls[b]);
    const seen = {};
    let d = 0;
    idx.forEach((v) => {
      const hz = Math.round(this.noteHz(v));
      if (seen[hz]) return;
      seen[hz] = true;
      this.tink(hz, d, 0.3);
      d += 0.11;
    });
  }
  toLin(c) { c = c / 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
  toSrgb(c) { const v = c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055; return Math.max(0, Math.min(255, Math.round(v * 255))); }
  hexToLab(h) {
    const r = this.toLin(parseInt(h.slice(1, 3), 16)), g = this.toLin(parseInt(h.slice(3, 5), 16)), b = this.toLin(parseInt(h.slice(5, 7), 16));
    const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
    const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
    const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
    return [0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s, 1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s, 0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s];
  }
  labToRgb(L, a, b) {
    const l = Math.pow(L + 0.3963377774 * a + 0.2158037573 * b, 3);
    const m = Math.pow(L - 0.1055613458 * a - 0.0638541728 * b, 3);
    const s = Math.pow(L - 0.0894841775 * a - 1.2914855480 * b, 3);
    const r = this.toSrgb(4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s);
    const g = this.toSrgb(-1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s);
    const bb = this.toSrgb(-0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s);
    return 'rgb(' + r + ',' + g + ',' + bb + ')';
  }
  buildGradient() {
    const tl = this.hexToLab('#E9C46A'), tr = this.hexToLab('#D98A8F'), bl = this.hexToLab('#2F8A8A'), br = this.hexToLab('#3E4E8C');
    const out = [];
    this.Ls = [];
    for (let y = 0; y < this.rows; y++) {
      for (let x = 0; x < this.cols; x++) {
        const u = x / (this.cols - 1), v = y / (this.rows - 1);
        const mix = (k) => (tl[k] * (1 - u) + tr[k] * u) * (1 - v) + (bl[k] * (1 - u) + br[k] * u) * v;
        this.Ls.push(mix(0));
        out.push(this.labToRgb(mix(0), mix(1), mix(2)));
      }
    }
    this.Lmin = Math.min.apply(null, this.Ls);
    this.Lmax = Math.max.apply(null, this.Ls);
    return out;
  }
  shuffled(seed) {
    const n = this.cols * this.rows;
    const order = [];
    for (let i = 0; i < n; i++) order.push(i);
    const free = order.filter((i) => this.anchors.indexOf(i) < 0);
    let s = seed;
    const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    for (let k = free.length - 1; k > 0; k--) {
      const j = Math.floor(rnd() * (k + 1));
      const a = free[k], b = free[j];
      const t = order[a]; order[a] = order[b]; order[b] = t;
    }
    return order;
  }
  tap(i) {
    if (this.anchors.indexOf(i) >= 0) { this.tick(500, 0.06, 0.05); return; }
    const sel = this.state.sel;
    if (sel === null) { this.tick(1600, 0.04, 0.07); this.setState({ sel: i }); return; }
    if (sel === i) { this.tick(1200, 0.04, 0.05); this.setState({ sel: null }); return; }
    const order = this.state.order.slice();
    const t = order[i]; order[i] = order[sel]; order[sel] = t;
    const solved = order.every((v, k) => v === k);
    if (solved) {
      this.playSolve();
    } else {
      let d = 0;
      let any = false;
      [i, sel].forEach((p) => { if (order[p] === p) { this.tink(this.noteHz(order[p]), d, 0.32); d += 0.07; any = true; } });
      if (!any) this.tick(320, 0.09, 0.06);
    }
    this.setState({ order, sel: null, moves: this.state.moves + 1 });
  }
  listen() {
    let d = 0;
    this.state.order.forEach((v) => { this.tink(this.noteHz(v), d, 0.22); d += 0.09; });
  }
  renderVals() {
    const order = this.state.order;
    const solved = order.every((v, i) => v === i);
    const wrong = order.filter((v, i) => v !== i).length;
    const tiles = order.map((v, i) => ({
      bg: this.colors[v],
      anchor: this.anchors.indexOf(i) >= 0,
      label: this.anchors.indexOf(i) >= 0 ? 'Fixed tile' : 'Tile ' + (i + 1),
      ring: this.state.sel === i ? 'inset 0 0 0 4px #F7F4EC, inset 0 0 0 6px #2A2622' : 'none',
      tap: () => this.tap(i)
    }));
    return {
      tiles, solved,
      moves: this.state.moves,
      headline: solved ? 'Solved. You found Sea Glass' : 'Put the gradient back in order',
      detail: solved ? 'A new tint for the catalog, plus 8 minutes of production.' : 'Every color has its own note. A tile in its right place rings. ' + wrong + ' tiles to go.',
      soundOn: this.state.soundOn,
      soundLabel: this.state.soundOn ? 'Sound on' : 'Sound off',
      toggleSound: () => this.setState({ soundOn: !this.state.soundOn }),
      listen: () => this.listen(),
      shuffle: () => this.setState({ order: this.shuffled(Math.floor(Math.random() * 1000) + 1), sel: null, moves: 0 })
    };
  }
}
</script>
</body>
</html>
