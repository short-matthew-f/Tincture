<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Matching an order</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#7B5236}a:hover{color:#5A3B26}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #E3E6E0; font-family: 'Figtree', 'Segoe UI', sans-serif; color: #2A2622; display: flex; flex-direction: column; overflow: hidden">

<div style="padding: 18px 18px 10px 18px; display: flex; align-items: center; justify-content: space-between">
<button aria-label="Back to orders" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: #F7F4EC; box-shadow: 0 2px 0 rgba(42,38,34,0.2); display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#2A2622" style="stroke-width: 2" aria-hidden="true"><path d="M12 4 L6 10 L12 16"></path></svg>
</button>
<div style="font-family: 'Young Serif', Georgia, serif; font-size: 20px">Order from Harbor Town</div>
<div style="width: 44px"></div>
</div>

<div style="margin: 4px 14px 0 14px; background: #F7F4EC; border-radius: 16px; padding: 14px; box-shadow: 0 3px 0 rgba(42,38,34,0.22); display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 14px; color: #5E5148">The lighthouse keeper wants a green like the moss on the harbor wall.</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="height: 130px; border-radius: 12px; background: {{target}}; box-shadow: 0 3px 0 rgba(42,38,34,0.28)"></div>
<div style="font-size: 13px; font-weight: 600">Their swatch</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="height: 130px; border-radius: 12px; background: {{mix}}; box-shadow: 0 3px 0 rgba(42,38,34,0.28); display: flex; align-items: flex-end; justify-content: flex-end; padding: 8px; box-sizing: border-box">
<sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
<div style="font-size: 13px; color: #5E5148">Add a drop</div>
</sc-if>
</div>
<div style="font-size: 13px; font-weight: 600">Your mix</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 13px">
<div style="font-weight: 600">{{closeLabel}}</div>
<div style="color: #5E5148">{{payLabel}}</div>
</div>
<div style="height: 10px; border-radius: 5px; background: #E3E6E0; overflow: hidden">
<div style="height: 10px; width: {{closeWidth}}; border-radius: 5px; background: #2A2622"></div>
</div>
</div>
</div>

<div style="margin: 14px 14px 0 14px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{drops}}" as="d" hint-placeholder-count="5">
<button aria-label="Add a drop of {{d.name}}" onClick="{{d.add}}" style="border: 0; background: transparent; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px">
<div style="width: 58px; height: 58px; border-radius: 29px 29px 29px 6px; transform: rotate(-45deg); background: {{d.hex}}; box-shadow: {{d.edge}}"></div>
<div style="font-size: 13px; font-weight: 600; color: #2A2622">{{d.name}}</div>
<div style="font-size: 12px; color: #5E5148">{{d.countLabel}}</div>
</button>
</sc-for>
</div>

<div style="margin: 14px 14px 0 14px; background: #F7F4EC; border-radius: 14px; padding: 12px 14px; box-shadow: 0 3px 0 rgba(42,38,34,0.22); display: flex; flex-direction: column; gap: 4px">
<div style="font-family: 'Young Serif', Georgia, serif; font-size: 17px">{{headline}}</div>
<div style="font-size: 14px; color: #5E5148">{{detail}}</div>
</div>

<div style="margin: auto 14px 20px 14px; display: flex; gap: 10px">
<button onClick="{{undo}}" style="min-height: 48px; padding: 0 18px; border: 0; border-radius: 12px; background: #F7F4EC; color: #2A2622; font-size: 15px; font-weight: 600; box-shadow: 0 3px 0 rgba(42,38,34,0.25)">Undo</button>
<button onClick="{{reset}}" style="min-height: 48px; padding: 0 18px; border: 0; border-radius: 12px; background: #F7F4EC; color: #2A2622; font-size: 15px; font-weight: 600; box-shadow: 0 3px 0 rgba(42,38,34,0.25)">Empty jar</button>
<button onClick="{{submit}}" style="flex-grow: 1; min-height: 48px; border: 0; border-radius: 12px; background: #2A2622; color: #F7F4EC; font-size: 15px; font-weight: 600; box-shadow: 0 3px 0 #000000">Deliver</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.pigments = [
      { name: 'Madder', hex: '#B8433A' },
      { name: 'Ochre', hex: '#D39B2A' },
      { name: 'Woad', hex: '#3E6A9E' },
      { name: 'White', hex: '#F4F2EC' },
      { name: 'Black', hex: '#2A2622' }
    ];
    this.recipe = [0, 3, 2, 1, 0];
    this.state = { counts: [0, 0, 0, 0, 0], history: [], delivered: null, soundOn: true };
  }
  lin(c) { c = c / 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
  srgb(c) { const v = c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055; return Math.max(0, Math.min(255, Math.round(v * 255))); }
  rgbLin(h) { return [this.lin(parseInt(h.slice(1, 3), 16)), this.lin(parseInt(h.slice(3, 5), 16)), this.lin(parseInt(h.slice(5, 7), 16))]; }
  blend(counts) {
    const total = counts.reduce((a, b) => a + b, 0);
    if (!total) return null;
    const out = [0, 0, 0];
    counts.forEach((n, i) => {
      if (!n) return;
      const c = this.rgbLin(this.pigments[i].hex);
      for (let k = 0; k < 3; k++) out[k] += (n / total) * Math.log(Math.max(c[k], 0.003));
    });
    return out.map((v) => Math.exp(v));
  }
  toLab(c) {
    const l = Math.cbrt(0.4122214708 * c[0] + 0.5363325363 * c[1] + 0.0514459929 * c[2]);
    const m = Math.cbrt(0.2119034982 * c[0] + 0.6806995451 * c[1] + 0.1073969566 * c[2]);
    const s = Math.cbrt(0.0883024619 * c[0] + 0.2817188376 * c[1] + 0.6299787005 * c[2]);
    return [0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s, 1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s, 0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s];
  }
  css(c) { return 'rgb(' + this.srgb(c[0]) + ',' + this.srgb(c[1]) + ',' + this.srgb(c[2]) + ')'; }
  audio() {
    if (!this.state.soundOn) return null;
    if (!this.ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      this.ac = new AC();
      this.master = this.ac.createGain(); this.master.gain.value = 0.5; this.master.connect(this.ac.destination);
    }
    if (this.ac.state === 'suspended') this.ac.resume();
    return this.ac;
  }
  tone(hz, delay, vol, len, type) {
    const ac = this.audio(); if (!ac) return;
    const t = ac.currentTime + (delay || 0);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.3, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (len || 0.8));
    g.connect(this.master);
    const o = ac.createOscillator(); o.type = type || 'sine'; o.frequency.value = hz; o.connect(g);
    o.start(t); o.stop(t + (len || 0.8) + 0.05);
  }
  glug(lightness) {
    const ac = this.audio(); if (!ac) return;
    const t = ac.currentTime;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
    g.connect(this.master);
    const o = ac.createOscillator(); o.type = 'sine';
    const base = 180 + lightness * 260;
    o.frequency.setValueAtTime(base, t);
    o.frequency.exponentialRampToValueAtTime(base * 1.9, t + 0.12);
    o.connect(g); o.start(t); o.stop(t + 0.3);
  }
  dist() {
    const a = this.blend(this.state.counts);
    if (!a) return null;
    const A = this.toLab(a), B = this.toLab(this.blend(this.recipe));
    return Math.sqrt(Math.pow(A[0] - B[0], 2) + Math.pow(A[1] - B[1], 2) + Math.pow(A[2] - B[2], 2)) * 100;
  }
  tier(d) {
    if (d < 2) return { name: 'Perfect', pay: 150 };
    if (d < 5) return { name: 'Great', pay: 120 };
    if (d < 10) return { name: 'Good', pay: 100 };
    if (d < 15) return { name: 'Close enough', pay: 70 };
    return { name: 'Still far off', pay: 70 };
  }
  renderVals() {
    const counts = this.state.counts;
    const mixLin = this.blend(counts);
    const d = this.dist();
    const tr = d === null ? null : this.tier(d);
    const closeness = d === null ? 0 : Math.max(0, Math.min(100, 100 - d * 4));
    const delivered = this.state.delivered;
    const drops = this.pigments.map((p, i) => ({
      name: p.name, hex: p.hex,
      edge: p.name === 'White' ? 'inset 0 0 0 1.5px #B7BDB3, 0 3px 0 rgba(42,38,34,0.22)' : '0 3px 0 rgba(42,38,34,0.28)',
      countLabel: counts[i] ? counts[i] + (counts[i] === 1 ? ' drop' : ' drops') : 'None',
      add: () => {
        const L = this.toLab(this.rgbLin(p.hex))[0];
        this.glug(L);
        const c = counts.slice(); c[i] += 1;
        this.setState({ counts: c, history: this.state.history.concat([i]), delivered: null });
      }
    }));
    let headline = 'Mix to match';
    let detail = 'Drops blend like paint. Anything you deliver pays at least 70%.';
    if (delivered) {
      headline = delivered.name + '. Paid ' + delivered.pay + '%';
      detail = delivered.name === 'Perfect' ? 'A reputation star for Harbor Town, and the keeper is thrilled.' : 'Delivered. Empty the jar to try for Perfect.';
    } else if (tr) {
      headline = tr.name === 'Still far off' ? 'Keep mixing' : 'Currently ' + tr.name;
    }
    return {
      drops,
      target: this.css(this.blend(this.recipe)),
      mix: mixLin ? this.css(mixLin) : '#FBF8F1',
      empty: !mixLin,
      closeLabel: d === null ? 'Closeness' : (tr.name === 'Still far off' ? 'Closeness' : tr.name),
      payLabel: d === null ? 'Pays 70% to 150%' : 'Pays ' + tr.pay + '%',
      closeWidth: closeness + '%',
      headline, detail,
      undo: () => {
        const h = this.state.history.slice(); const last = h.pop();
        if (last === undefined) return;
        const c = counts.slice(); c[last] -= 1;
        this.tone(330, 0, 0.08, 0.1, 'triangle');
        this.setState({ counts: c, history: h, delivered: null });
      },
      reset: () => { this.tone(220, 0, 0.1, 0.2, 'triangle'); this.setState({ counts: [0, 0, 0, 0, 0], history: [], delivered: null }); },
      submit: () => {
        if (d === null) return;
        const t = this.tier(d);
        const chords = { 'Perfect': [0, 4, 7, 12, 16], 'Great': [0, 4, 7, 12], 'Good': [0, 4, 7], 'Close enough': [0, 7], 'Still far off': [0, 7] };
        chords[t.name].forEach((st, k) => this.tone(262 * Math.pow(2, st / 12), k * 0.07, 0.22, 1.1));
        this.setState({ delivered: t });
      }
    };
  }
}
</script>
</body>
</html>
