<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4EFE4">
<title>Knitting Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="../shared.css">
<style>
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
  header { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 4px 12px 0; }
  header h1 { flex: 1 1 auto; margin: 0; font: 400 20px var(--font-display); }
  .views { display: flex; gap: 6px; padding: 6px 12px; flex: 0 0 auto; overflow-x: auto; }
  .stage { position: relative; flex: 1 1 40%; min-height: 160px; margin: 0 12px; border-radius: 14px; overflow: auto; background: #D8CFBE; box-shadow: inset 0 0 0 1px var(--line); -webkit-overflow-scrolling: touch; }
  .stage canvas { display: block; margin: 0 auto; }
  .status { flex: 0 0 auto; padding: 6px 12px 0; display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .status b { font-weight: 700; }
  .status .grow { flex: 1 1 auto; min-width: 0; }
  .needle { flex: 0 0 auto; margin: 4px 12px 0; height: 22px; display: flex; align-items: center; gap: 2px; overflow-x: auto; padding: 0 4px; border-radius: 11px; background: #E9E2D3; }
  .needle i { flex: 0 0 auto; width: 7px; height: 12px; border-radius: 3px; display: block; }
  .needle i.done { opacity: .35; }
  .needle i.next { outline: 2px solid var(--gold); outline-offset: 1px; }
  .needle i.mk { width: 2px; height: 18px; background: var(--ink); border-radius: 1px; opacity: .6; }
  .tray > * { flex: 0 0 auto; }
  .tray { flex: 0 0 auto; padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; max-height: 52%; overflow-y: auto; }
  .row { display: flex; gap: 6px; align-items: center; }
  .row.wrap { flex-wrap: wrap; }
  .big { flex: 1 1 0; min-height: 56px; font-size: 20px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .tabs .btn { flex: 0 0 auto; }
  .pad { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; }
  .pad .btn { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px 4px; min-height: 52px; line-height: 1.1; }
  .pad .btn small { font-weight: 500; font-size: 10px; color: var(--ink-soft); margin-top: 2px; }
  .yarns { display: flex; gap: 6px; }
  .yarn { flex: 1 1 0; min-width: 0; height: 40px; border-radius: 12px; border: 0; box-shadow: var(--shadow); position: relative; font: 700 13px var(--font-ui); cursor: pointer; }
  .yarn[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ink), var(--shadow); }
  .typed { display: flex; gap: 6px; }
  .typed input { flex: 1 1 auto; min-width: 0; min-height: var(--tap); border-radius: 12px; border: 0; padding: 0 12px; font: 500 15px var(--font-ui); background: var(--card); box-shadow: inset 0 0 0 1.5px var(--line); }
  .rec { background: #F3E3B8 !important; }
  .msg { min-height: 18px; font-size: 13px; color: var(--ink-soft); }
  .sheet-bg { position: fixed; inset: 0; background: rgba(42,38,34,.35); display: flex; align-items: flex-end; z-index: 20; }
  .sheet { background: var(--paper); width: 100%; max-height: 85vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 0 rgba(42,38,34,.12); animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
  .sheet h2 { margin: 0 0 8px; font: 400 20px var(--font-display); }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .list .btn { text-align: left; justify-content: flex-start; padding: 10px 14px; display: block; height: auto; }
  .list .btn small { display: block; font-weight: 500; color: var(--ink-soft); font-size: 12px; margin-top: 2px; }
  .pattern { font-size: 14px; line-height: 1.45; }
  .pattern p { margin: 0 0 6px; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--ink-soft); }
  .field input { min-height: var(--tap); border-radius: 12px; border: 0; padding: 0 12px; font: 600 16px var(--font-ui); background: var(--card); box-shadow: inset 0 0 0 1.5px var(--line); }
  .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .swatches button { height: 44px; border-radius: 12px; border: 0; box-shadow: var(--shadow); }
  .pulse { animation: pulse .3s ease-out; }
  @keyframes pulse { 0% { transform: scale(.96); } 100% { transform: none; } }
</style>
</head>
<body>
<header>
  <a class="back" href="../index.html">&#8592;</a>
  <h1>Knitting Room</h1>
  <button class="btn small" data-act="samples">Samples</button>
  <button class="btn small" data-act="new">New</button>
</header>
<div class="views" data-ref="views"></div>
<div class="stage" data-ref="stage"><canvas data-ref="canvas"></canvas></div>
<div class="status" data-ref="status"></div>
<div class="needle" data-ref="needle" aria-label="Stitches on the needle"></div>
<div class="tray">
  <div class="row">
    <button class="btn big" data-st="k" aria-label="Knit">k</button>
    <button class="btn big" data-st="p" aria-label="Purl">p</button>
    <button class="btn" data-act="appear" style="flex:1.2 1 0;min-height:56px;line-height:1.1">as it<br>appears</button>
    <button class="btn" data-act="undo" style="min-height:56px" aria-label="Undo one">&#8630;</button>
  </div>
  <div class="tabs" data-ref="tabs"></div>
  <div class="pad" data-ref="pad"></div>
  <div class="row wrap" data-ref="helpers"></div>
  <div class="yarns" data-ref="yarns"></div>
  <div class="typed"><input data-ref="typed" placeholder="Type a row: k2, *p2, k2; rep from * to end" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go"><button class="btn primary" data-act="typed">Knit it</button></div>
  <div class="msg" data-ref="msg" aria-live="polite"></div>
  <div class="row"><button class="btn" data-act="pattern" style="flex:1">Written pattern</button><button class="btn" data-act="rip" style="flex:1">Rip back row</button></div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
