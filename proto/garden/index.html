<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4EFE4">
<title>The Dye Garden</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="../shared.css">
<style>
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 8px 16px 40px; }
  h1 { font: 400 28px var(--font-display); margin: 4px 0 4px; }
  .intro { margin: 0 0 14px; line-height: 1.45; }

  /* choosing a place */
  #places { display: flex; flex-direction: column; gap: 12px; }
  .place { all: unset; box-sizing: border-box; display: block; width: 100%; cursor: pointer; background: var(--card); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .place:active { transform: translateY(2px); box-shadow: var(--press); }
  .place:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .place canvas { display: block; width: 100%; height: 84px; }
  .place .t { padding: 10px 12px 12px; }
  .place h2 { margin: 0 0 3px; font: 400 21px var(--font-display); }
  .place p { margin: 0; color: var(--ink-soft); font-size: 15px; line-height: 1.4; }
  .place .dyes { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 13px; color: var(--ink-soft); }
  .place .dyes span { display: inline-flex; align-items: center; gap: 5px; }
  .place .dyes i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(42,38,34,.2); }
  #continue { width: 100%; min-height: 52px; margin: 0 0 12px; font-size: 16px; }
  .shelf { margin-top: 16px; }
  .shelf h2 { font: 400 19px var(--font-display); margin: 0 0 8px; }
  .shelf ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 14px; }
  .shelf li { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  details.how { margin-top: 14px; font-size: 15px; }
  details.how summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; font-weight: 600; }
  details.how ol, .help ol { margin: 0; padding-left: 22px; line-height: 1.5; }
  details.how li, .help li { margin-bottom: 6px; }

  /* jars */
  .jar { --c: #ccc; --f: 0%; position: relative; flex: none; width: 24px; height: 32px; border-radius: 5px 5px 8px 8px; background: color-mix(in srgb, var(--c) 16%, #fff); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--c) 55%, rgba(42,38,34,.4)), 0 2px 0 rgba(42,38,34,.14); overflow: hidden; }
  .jar::before { content: ''; position: absolute; left: 3px; right: 3px; top: 0; height: 4px; border-radius: 0 0 2px 2px; background: #B39A74; z-index: 2; }
  .jar i { position: absolute; left: 0; right: 0; bottom: 0; height: var(--f); background: var(--c); transition: height .35s ease; }
  .jar i::after { content: ''; position: absolute; left: 4px; top: 3px; width: 3px; bottom: 3px; border-radius: 2px; background: rgba(255,255,255,.28); }
  .jarbox { position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 26px; }
  .jarbox b { font-size: 11px; font-weight: 700; color: var(--ink-soft); line-height: 1; min-height: 11px; font-variant-numeric: tabular-nums; }
  .jarbox.pulse .jar { animation: pulse .45s ease; }
  @keyframes pulse { 40% { transform: translateY(-3px) scale(1.08); } }

  /* playing */
  html.playing, html.playing body { overflow: hidden; overscroll-behavior: none; height: 100%; position: fixed; inset: 0; }
  #play { position: fixed; inset: 0; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .hud-top { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 6px; padding: calc(4px + env(safe-area-inset-top)) 8px 4px; pointer-events: none; }
  .hud-top > * { pointer-events: auto; }
  .chipbtn { appearance: none; border: 0; min-width: 44px; min-height: 44px; padding: 0 12px; border-radius: 22px; background: rgba(251,248,241,.92); box-shadow: var(--shadow); font: 600 14px var(--font-ui); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; touch-action: manipulation; }
  .chipbtn:active { transform: translateY(2px); box-shadow: var(--press); }
  .chipbtn[aria-pressed="true"] { background: #F3E3B8; }
  .chipbtn svg { width: 20px; height: 20px; }
  #placeName { flex: 1; min-width: 0; text-align: center; font: 400 18px var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 0 rgba(255,255,255,.6); }
  .next { position: absolute; left: 8px; top: calc(54px + env(safe-area-inset-top)); display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 6px; border-radius: 22px; background: rgba(251,248,241,.92); box-shadow: 0 2px 0 rgba(42,38,34,.14); font-size: 14px; pointer-events: none; max-width: calc(100% - 16px); }
  .next canvas { width: 30px; height: 30px; flex: none; }
  .next .bar { width: 54px; height: 6px; border-radius: 3px; background: rgba(42,38,34,.12); overflow: hidden; flex: none; }
  .next .bar i { display: block; height: 100%; width: var(--p, 0%); background: var(--gold); transition: width .3s ease; }
  .next.glad { background: #F3E3B8; box-shadow: 0 0 0 2px var(--gold), 0 2px 0 rgba(42,38,34,.14); }
  .coach { position: absolute; left: 50%; top: 62%; transform: translateX(-50%); padding: 10px 16px; border-radius: 14px; background: rgba(251,248,241,.94); box-shadow: var(--shadow); font-size: 15px; font-weight: 500; text-align: center; pointer-events: none; transition: opacity .6s ease; max-width: min(320px, calc(100% - 32px)); }
  .coach.gone { opacity: 0; }
  .hud-bot { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: flex-end; gap: 8px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: rgba(251,248,241,.94); box-shadow: 0 -3px 0 rgba(42,38,34,.06), 0 -8px 20px rgba(42,38,34,.08); }
  #jars { flex: 1; min-width: 0; display: flex; gap: 4px; align-items: flex-end; overflow: hidden; }
  #home { flex: none; min-height: 48px; padding: 0 16px; }

  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(42,38,34,.28); overflow: auto; }
  .overlay .card { width: 100%; max-width: 420px; max-height: 100%; overflow: auto; padding: 16px; }
  .overlay h2 { font: 400 24px var(--font-display); margin: 0 0 4px; }
  .help .btn { width: 100%; margin-top: 8px; min-height: 50px; }
  #haul { list-style: none; margin: 12px 0; padding: 0; }
  #haul li { display: flex; align-items: center; gap: 12px; padding: 7px 2px; border-top: 1px solid var(--line); font-size: 15px; }
  #haul li .nm { flex: 1; }
  #haul li em { font-style: normal; color: var(--ink-soft); font-size: 14px; }
  .fact { background: #F3EBD7; border-radius: 12px; padding: 10px 12px; margin: 4px 0 12px; font-size: 15px; line-height: 1.45; }
  .fact small { display: block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 3px; }
  .endbtns { display: flex; gap: 8px; flex-wrap: wrap; }
  .endbtns .btn { flex: 1 1 140px; min-height: 50px; }
  @media (prefers-reduced-motion: reduce) { .jar i, .coach, .next .bar i { transition: none; } .jarbox.pulse .jar { animation: none; } }
</style>
</head>
<body>
<div id="choose">
  <div class="wrap">
    <a class="back" href="../">&#8592; Prototypes</a>
    <h1>The Dye Garden</h1>
    <p class="intro muted">Wander with a basket and gather real dye plants. Start with the little ones; the basket grows as it fills. No timer, nothing to lose.</p>
    <button type="button" class="btn primary" id="continue" hidden></button>
    <div id="places"></div>
    <details class="how">
      <summary>How this works</summary>
      <ol id="howList"></ol>
    </details>
    <section class="shelf card" id="shelf" hidden>
      <h2>Your dye shelf</h2>
      <ul id="shelfList"></ul>
      <p class="hint" id="shelfNote" style="margin:10px 0 0"></p>
    </section>
  </div>
</div>

<div id="play" hidden>
  <canvas id="cv" aria-label="The garden. Drag anywhere to steer the basket."></canvas>
  <div class="hud-top">
    <button type="button" class="chipbtn" id="leave" aria-label="Back to the places">&#8592;</button>
    <span id="placeName"></span>
    <button type="button" class="chipbtn" id="sound" aria-pressed="false" aria-label="Sound is off">&#9834; Off</button>
    <button type="button" class="chipbtn" id="helpBtn" aria-label="How this works">?</button>
  </div>
  <div class="next" id="next" aria-live="polite"></div>
  <div class="coach" id="coach">Drag anywhere to steer the basket</div>
  <div class="hud-bot">
    <div id="jars" aria-label="Your jars so far"></div>
    <button type="button" class="btn primary" id="home">Head home</button>
  </div>

  <div class="overlay help" id="help" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
      <h2 id="helpTitle">How this works</h2>
      <ol id="helpList"></ol>
      <button type="button" class="btn primary" id="helpOk">Start gathering</button>
    </div>
  </div>

  <div class="overlay" id="end" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="endTitle">
      <h2 id="endTitle"></h2>
      <p class="muted" id="endSub" style="margin:0"></p>
      <ul id="haul"></ul>
      <div class="fact" id="fact"></div>
      <div class="endbtns">
        <button type="button" class="btn primary" id="again">Visit again</button>
        <button type="button" class="btn" id="another">Another place</button>
      </div>
    </div>
  </div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
