<!doctype html>
<html lang="en" data-motion="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tincture</title>
  <meta name="description" content="A cozy color-mixing idle game: mix pigments, discover and name new colors, and fill your catalog.">
  <meta name="theme-color" content="#E3E6E0">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tincture">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section class="screen" id="screen-workshop" data-screen="workshop" hidden></section>
    <section class="screen" id="screen-orders" data-screen="orders" hidden></section>
    <section class="screen" id="screen-puzzles" data-screen="puzzles" hidden></section>
    <section class="screen" id="screen-map" data-screen="map" hidden></section>
    <section class="screen" id="screen-catalog" data-screen="catalog" hidden></section>
    <section class="screen" id="screen-ledger" data-screen="ledger" hidden></section>
    <section class="screen" id="screen-album" data-screen="album" hidden></section>
    <section class="screen" id="screen-quests" data-screen="quests" hidden></section>
    <section class="screen" id="screen-gallery" data-screen="gallery" hidden></section>
    <section class="screen" id="screen-shelf" data-screen="shelf" hidden></section>
    <section class="screen" id="screen-settings" data-screen="settings" hidden></section>
    <section class="screen" id="screen-grading" data-screen="grading" hidden></section>
    <section class="screen" id="screen-purify" data-screen="purify" hidden></section>
    <section class="screen" id="screen-packing" data-screen="packing" hidden></section>
    <section class="screen" id="screen-matching" data-screen="matching" hidden></section>
    <section class="screen" id="screen-bench" data-screen="bench" hidden></section>
    <section class="screen" id="screen-paint" data-screen="paint" hidden></section>
    <section class="screen" id="screen-hunter" data-screen="hunter" hidden></section>
    <section class="screen" id="screen-commissions" data-screen="commissions" hidden></section>
    <section class="screen" id="screen-heritage" data-screen="heritage" hidden></section>
    <section class="screen" id="screen-naming" data-screen="naming" hidden></section>
    <section class="screen" id="screen-phase-beat" data-screen="phase-beat" hidden></section>
    <section class="screen" id="screen-onboarding" data-screen="onboarding" hidden></section>
  </main>

  <nav id="tabbar" class="tabbar" aria-label="Main">
    <button type="button" class="tab" data-tab="workshop" data-tap aria-label="Workshop">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 L12 4 L21 11 V20 H3 Z"></path><path d="M9 20 V14 H15 V20"></path></svg>
      <span>Workshop</span>
    </button>
    <button type="button" class="tab" data-tab="orders" data-tap aria-label="Orders">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="16" rx="2"></rect><path d="M9 9 H15 M9 13 H15 M9 17 H12"></path></svg>
      <span>Orders</span>
    </button>
    <button type="button" class="tab" data-tab="puzzles" data-tap aria-label="Puzzles">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1"></rect><rect x="13" y="4" width="7" height="7" rx="1"></rect><rect x="4" y="13" width="7" height="7" rx="1"></rect><rect x="13" y="13" width="7" height="7" rx="1"></rect></svg>
      <span>Puzzles</span>
    </button>
    <button type="button" class="tab" data-tab="map" data-tap aria-label="Map">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6 L9 4 L15 6 L21 4 V18 L15 20 L9 18 L3 20 Z"></path><path d="M9 4 V18 M15 6 V20"></path></svg>
      <span>Map</span>
    </button>
    <button type="button" class="tab" data-tab="catalog" data-tap aria-label="Catalog">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4 H17 A2 2 0 0 1 19 6 V20 H7 A2 2 0 0 1 5 18 Z"></path><path d="M5 18 A2 2 0 0 1 7 16 H19"></path></svg>
      <span>Catalog</span>
    </button>
  </nav>

  <div id="toasts" aria-live="polite" aria-atomic="false"></div>
  <div id="modal" hidden></div>
  <div id="fx-layer" aria-hidden="true"></div>

  <noscript>Tincture needs JavaScript to run. Please turn it on and reload.</noscript>
  <script type="module" src="src/app.js"></script>
</body>
</html>
